# Foundry casting file — deploys SigNoz locally via Docker Compose,
# with its MCP server enabled (required for the SigNoz MCP integration
# scoring criterion).
#
# Usage:
#   foundryctl gauge -f casting.yaml   # validate Docker/Compose are present
#   foundryctl cast  -f casting.yaml   # generate + deploy in one step
#
# `cast` renders the Compose files into pours/deployment/ and writes
# casting.yaml.lock next to this file automatically — don't hand-write
# that lock file, and don't hand-edit anything under pours/ (forge
# overwrites it on every run). Commit both casting.yaml and the
# generated casting.yaml.lock to the repo once you've cast successfully.
#
# After it's up: SigNoz UI at http://localhost:8080, OTLP ingestion at
# localhost:4317 (gRPC) / localhost:4318 (HTTP), MCP server at
# localhost:8000.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  mcp:
    spec:
      enabled: true
